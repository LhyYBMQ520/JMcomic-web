<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <title>账户管理 - JMComic Web</title>
    <style>
        :root {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            color: #172033;
            background: #f5f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
        }

        .shell {
            width: min(1120px, 100%);
            margin: auto;
            padding: 28px 22px 56px;
        }

        .topbar,
        .title-row,
        .actions {
            display: flex;
            align-items: center;
        }

        .topbar {
            justify-content: space-between;
            margin-bottom: 32px;
        }

        .brand {
            display: flex;
            gap: 11px;
            align-items: center;
            font-weight: 750;
        }

        .mark {
            display: grid;
            width: 38px;
            height: 38px;
            color: #fff;
            font-size: 20px;
            background: #16233b;
            border-radius: 10px;
            place-items: center;
        }

        .nav {
            display: flex;
            gap: 8px;
        }

        .nav a,
        .nav button {
            padding: 8px 11px;
            color: #647089;
            font: inherit;
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
            background: transparent;
            border: 0;
        }

        .title-row {
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 7px;
            font-size: 30px;
        }

        .subtitle,
        .muted {
            color: #77839a;
            font-size: 13px;
        }

        .panel {
            overflow: hidden;
            background: #fff;
            border: 1px solid #e4e9f1;
            border-radius: 8px;
            box-shadow: 0 8px 24px #1c2a420f;
        }

        .create-form {
            display: grid;
            grid-template-columns: minmax(240px, 1.4fr) minmax(180px, 1fr) auto auto;
            gap: 10px;
            padding: 18px;
            border-bottom: 1px solid #edf0f5;
        }

        input[type="text"] {
            width: 100%;
            min-width: 0;
            padding: 10px 12px;
            color: #172033;
            font: inherit;
            background: #fbfcfe;
            border: 1px solid #d5dce8;
            border-radius: 6px;
            outline: 0;
        }

        input:focus {
            border-color: #4774d1;
            box-shadow: 0 0 0 3px #e5edff;
        }

        button {
            padding: 10px 14px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            border: 0;
            border-radius: 6px;
            transition: background 160ms ease, transform 160ms ease-out;
        }

        button:active {
            transform: scale(.97);
        }

        .primary {
            color: #fff;
            background: #285dcc;
        }

        .secondary {
            color: #31569c;
            background: #edf2fb;
        }

        .danger {
            color: #b83d3d;
            background: #fff0f0;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px 14px;
            text-align: left;
            vertical-align: middle;
            border-bottom: 1px solid #edf0f5;
        }

        th {
            color: #68758c;
            font-size: 12px;
            font-weight: 750;
            background: #fafbfd;
        }

        td {
            font-size: 13px;
        }

        td input[type="text"] {
            min-width: 170px;
            padding: 8px 10px;
        }

        .actions {
            gap: 7px;
            white-space: nowrap;
        }

        .actions button {
            padding: 8px 10px;
            font-size: 12px;
        }

        .empty {
            padding: 34px;
            color: #8b96aa;
            text-align: center;
        }

        .message {
            min-height: 22px;
            margin-top: 12px;
            color: #526078;
            font-size: 13px;
        }

        .message.error {
            color: #bd4141;
        }

        @media (max-width: 780px) {
            .shell {
                padding: 18px 12px 40px;
            }

            .title-row {
                align-items: flex-start;
                flex-direction: column;
            }

            .create-form {
                grid-template-columns: 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            button {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <main class="shell">
        <header class="topbar">
            <div class="brand">
                <div class="mark">J</div>
                <span>JMComic 管理</span>
            </div>
            <nav class="nav">
                <a href="/app">下载工作台</a>
                <button id="logout" type="button">退出登录</button>
            </nav>
        </header>

        <section class="title-row">
            <div>
                <h1>普通账户</h1>
                <div class="subtitle">创建访问令牌、维护备注，并控制账户是否可以登录。</div>
            </div>
            <div id="accountCount" class="muted">0 个账户</div>
        </section>

        <section class="panel">
            <form id="createForm" class="create-form">
                <input id="newToken" type="text" minlength="12" maxlength="256" autocomplete="off"
                    spellcheck="false" placeholder="新用户令牌" required>
                <input id="newNote" type="text" maxlength="200" placeholder="账户备注">
                <button id="generate" class="secondary" type="button">生成令牌</button>
                <button class="primary" type="submit">创建账户</button>
            </form>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>备注</th>
                            <th>当前令牌</th>
                            <th>启用</th>
                            <th>任务数</th>
                            <th>创建时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="users"></tbody>
                </table>
                <div id="empty" class="empty" hidden>暂无普通账户。</div>
            </div>
        </section>
        <div id="message" class="message" role="status"></div>
    </main>

    <script>
        const usersBody = document.getElementById('users');
        const message = document.getElementById('message');

        function escapeHtml(value) {
            return String(value).replace(/[&<>'"]/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            })[char]);
        }

        async function request(url, options = {}) {
            const response = await fetch(url, options);
            if (response.status === 401) {
                location.replace('/');
                throw new Error('登录已失效');
            }
            if (response.status === 403) {
                location.replace('/app');
                throw new Error('需要管理员权限');
            }
            if (!response.ok) {
                const data = await response.json();
                throw new Error(data.detail || '请求失败');
            }
            return response.status === 204 ? null : response.json();
        }

        function showMessage(text, isError = false) {
            message.textContent = text;
            message.className = `message${isError ? ' error' : ''}`;
        }

        async function loadUsers() {
            const data = await request('/api/admin/users');
            document.getElementById('accountCount').textContent = `${data.items.length} 个账户`;
            document.getElementById('empty').hidden = data.items.length !== 0;
            usersBody.innerHTML = data.items.map(user => `
                <tr data-user-id="${user.id}">
                    <td>${user.id}</td>
                    <td><input class="note" type="text" maxlength="200" value="${escapeHtml(user.note)}"></td>
                    <td><input class="token" type="text" minlength="12" maxlength="256" autocomplete="off"
                        spellcheck="false" value="${escapeHtml(user.token || '')}"
                        placeholder="旧数据不可恢复，请设置新令牌"></td>
                    <td><input class="enabled" type="checkbox" ${user.enabled ? 'checked' : ''}></td>
                    <td>${user.task_count}</td>
                    <td>${new Date(user.created_at * 1000).toLocaleString()}</td>
                    <td class="actions">
                        <button class="save secondary" type="button">保存</button>
                        <button class="delete danger" type="button">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('generate').onclick = () => {
            const bytes = new Uint8Array(24);
            crypto.getRandomValues(bytes);
            document.getElementById('newToken').value = btoa(String.fromCharCode(...bytes))
                .replaceAll('+', '-').replaceAll('/', '_').replaceAll('=', '');
        };

        document.getElementById('createForm').onsubmit = async event => {
            event.preventDefault();
            try {
                await request('/api/admin/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: document.getElementById('newToken').value,
                        note: document.getElementById('newNote').value,
                        enabled: true
                    })
                });
                event.target.reset();
                showMessage('账户已创建。');
                await loadUsers();
            } catch (error) {
                showMessage(error.message, true);
            }
        };

        usersBody.onclick = async event => {
            const row = event.target.closest('tr');
            if (!row || !(event.target instanceof HTMLButtonElement)) {
                return;
            }
            const userId = row.dataset.userId;
            try {
                if (event.target.classList.contains('save')) {
                    await request(`/api/admin/users/${userId}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            token: row.querySelector('.token').value || null,
                            note: row.querySelector('.note').value,
                            enabled: row.querySelector('.enabled').checked
                        })
                    });
                    showMessage('账户已更新。');
                }

                if (event.target.classList.contains('delete')) {
                    if (!confirm('确认删除该账户及其已结束任务文件？')) {
                        return;
                    }
                    await request(`/api/admin/users/${userId}`, { method: 'DELETE' });
                    showMessage('账户已删除。');
                }
                await loadUsers();
            } catch (error) {
                showMessage(error.message, true);
            }
        };

        document.getElementById('logout').onclick = async () => {
            await fetch('/api/session', { method: 'DELETE' });
            location.replace('/');
        };

        loadUsers().catch(error => showMessage(error.message, true));

        setInterval(() => {
            if (document.visibilityState === 'visible' && !usersBody.contains(document.activeElement)) {
                loadUsers().catch(error => showMessage(error.message, true));
            }
        }, 5000);
    </script>
</body>

</html>
